<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#123b2b">
<title>Sreelekshmi & Vishnu</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="loader"><span>✦</span></div>

<!-- The cover is a real overlay, so there is no blank second page. -->
<section id="cover" aria-label="Open wedding announcement">
  <div class="cover-card">
    <img src="assets/cover.png" alt="" class="cover-image">
    <button id="open" class="open-button" aria-label="Open invitation">TAP TO OPEN</button>
  </div>
</section>

<main id="invitation">
  <div class="art-wrap">
    <img src="assets/invitation_art.png" alt="Kerala-inspired wedding announcement for Sreelekshmi Ravi and Vishnu M S" class="art">

    <!-- A duplicate of the illustrated couple from the artwork, animated very subtly. -->
    <img src="assets/couple_overlay.png" alt="" class="couple-motion" aria-hidden="true">

    <!-- This masks the printed date until the scratch interaction is completed. -->
    <div id="dateMask" class="date-mask" aria-hidden="true"></div>

    <!-- Real scratch interaction positioned over the gold scratch panel. -->
    <div id="scratchArea" class="scratch-area" aria-label="Scratch to reveal the wedding date and time">
      <canvas id="scratchCanvas"></canvas>
      <div id="scratchHint"><span>☝</span><b>SCRATCH HERE</b><small>Reveal our special day</small></div>
    </div>

    <div class="scroll-cue">SCROLL TO FEEL OUR STORY <span>⌄</span></div>
  </div>
</main>

<div id="tapFx" aria-hidden="true"></div>
<div id="petals" aria-hidden="true"></div>
<script src="script.js"></script>
</body>
</html>
